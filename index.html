<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gestión Productiva</title>
  <script>
    // Entry point: si ya hay sesion, va directo a Inicio; si no, al login.
    (function () {
      if (sessionStorage.getItem('gp_auth') === 'ok') {
        window.location.replace('Inicio/index.html');
      } else {
        window.location.replace('login.html');
      }
    })();
  </script>
</head>
<body></body>
</html>
