<!doctype html>
<html lang="es">
<head>
  <script src="../../auth-guard.js"></script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Envío a Proveedores de Servicios</title>
  <link rel="stylesheet" href="EntregaPS.css?v=20260604d" />
  <link rel="stylesheet" href="../../tandas-popup.css?v=20260604a" />
</head>
<body>

  <div class="card">
    <div class="header-bar">
      
      <div class="header-left">
        <button onclick="gpHome()" class="btn-home" type="button">
          ← Inicio
        </button>
        <h1>Entrega de Proveedores de Servicios</h1>
      </div>
      <script>
        function gpHome(){
          var r = sessionStorage.getItem('gp_role') || 'admin';
          window.location.href = (r === 'envios') ? '../../envios-only.html' : '../../Inicio/index.html';
        }
      </script>

      <div class="header-right hidden" id="selectedBar">
        <button id="btnVolver" class="btn-volver" type="button">← Cambiar proveedor</button>
        <div id="selectedBadge" class="selected-badge"></div>
        <button id="btnLimpiar" class="btn-volver" type="button" title="Vaciar todo lo cargado">🗑 Limpiar</button>
        <button id="btnEnviarCambiosTop" class="btn-enviar" type="button" disabled>Enviar</button>
      </div>
    </div>

    <div id="status" class="status">Cargando proveedores...</div>

    <!-- Vista inicial -->
    <div id="psGridWrap" class="selector-wrap hidden">
      <div id="psGrid" class="ps-grid"></div>
    </div>

    <!-- Vista detalle -->
    <div id="detailWrap" class="detail-wrap hidden">
      <div class="table-shell">
        <table class="table">
          <thead>
            <tr class="table-title-row">
              <th colspan="7" id="tableTitle">Proveedor</th>
            </tr>
            <tr>
              <th>Parte</th>
              <th>Proceso</th>
              <th>SC</th>
              <th>SP</th>
              <th>Caj</th>
              <th>Kg<br>Neto</th>
              <th title="Tandas">T</th>
            </tr>
          </thead>
          <tbody id="resultBody"></tbody>
        </table>
      </div>

      <div class="bottom-actions">
        <div id="tableMsg" class="status"></div>
        <!-- btnEnviarCambios oculto: el botón visible es btnEnviarCambiosTop en el header. Se mantiene oculto solo como destino del .click() del mirror. -->
        <button id="btnEnviarCambios" class="btn-enviar hidden" type="button" style="display:none">
          Enviar
        </button>
      </div>
    </div>

    <div id="successBox" class="successBox">
      <div class="title">Envío registrado</div>
      <div>Tu código de envío:</div>
      <div id="successCode" class="successCode">—</div>
      <button id="okBtn" class="okBtn" type="button">OK</button>
    </div>

    <iframe name="sheet_iframe" style="display:none"></iframe>
    <form id="sheetForm" action="TU_WEBAPP_URL_AQUI" method="POST" target="sheet_iframe" class="hidden">
      <input type="hidden" name="payload" id="payloadField" value="">
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../../tandas-popup.js?v=20260604a"></script>
  <script src="EntregaPS.js?v=20260604d"></script>
</body>
</html>
